# prefix
set -g prefix C-t
unbind C-b
bind C-t send-prefix

# general
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 0
set -g history-limit 10000

# true color (needed for gruvbox-material in nvim to render correctly inside tmux)
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# vi-style keys in copy mode
setw -g mode-keys vi

# split panes in the current pane's directory, with more intuitive keys
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# reload config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

# status bar
set -g status-style bg=default
set -g status-left ""
set -g status-right "#[fg=colour245]%Y-%m-%d %H:%M"
setw -g window-status-current-style bold

# plugins (managed by tpm - prefix + I installs, prefix + U updates)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'egel/tmux-gruvbox'
set -g @tmux-gruvbox 'dark'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'

# keep this line at the very bottom of tmux.conf
run '~/.config/tmux/plugins/tpm/tpm'
